<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset WildEx Password</title>
  <style>
    :root {
      --bg: #081018;
      --surface: #101b27;
      --surface2: #172636;
      --accent: #22c55e;
      --text: #ecf6ef;
      --muted: #88a19d;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      margin: 0;
      background: radial-gradient(circle at top, #142638 0%, #081018 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(16, 27, 39, 0.94);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      padding: 28px 22px 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.32);
    }
    h1 { color: var(--accent); margin: 0 0 10px; font-size: 1.8rem; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, button {
      width: 100%;
      border-radius: 14px;
      padding: 14px 15px;
      font-size: 1rem;
    }
    input {
      border: 1px solid rgba(255,255,255,0.08);
      background: var(--surface2);
      color: var(--text);
    }
    button {
      border: none;
      background: var(--accent);
      color: #081209;
      font-weight: 800;
    }
    .status, .error {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.45;
    }
    .status.visible {
      display: block;
      color: #b8ebc5;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.18);
    }
    .error.visible {
      display: block;
      color: var(--danger);
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.18);
    }
    a { color: var(--accent); text-decoration: none; display: inline-block; margin-top: 16px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Reset Password</h1>
    <p>Choose a new password for your WildEx account. Reset links expire automatically.</p>
    <form id="reset-form">
      <input id="password" type="password" minlength="8" placeholder="New password" required>
      <input id="password-confirm" type="password" minlength="8" placeholder="Confirm new password" required>
      <button type="submit">Save New Password</button>
    </form>
    <div class="status" id="status-box"></div>
    <div class="error" id="error-box"></div>
    <a href="/login">Back to sign in</a>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    const statusBox = document.getElementById('status-box');
    const errorBox = document.getElementById('error-box');

    document.getElementById('reset-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      statusBox.classList.remove('visible');
      errorBox.classList.remove('visible');
      if (!token) {
        errorBox.textContent = 'Reset token missing.';
        errorBox.classList.add('visible');
        return;
      }
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('password-confirm').value;
      if (password !== confirm) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.classList.add('visible');
        return;
      }
      const response = await fetch('/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ token, password }),
      }).catch(() => null);
      if (!response) {
        errorBox.textContent = 'Could not reach the server.';
        errorBox.classList.add('visible');
        return;
      }
      const payload = await response.json().catch(() => ({ detail: 'Request failed' }));
      if (!response.ok) {
        errorBox.textContent = payload.detail || 'Request failed';
        errorBox.classList.add('visible');
        return;
      }
      statusBox.textContent = 'Password updated. Redirecting…';
      statusBox.classList.add('visible');
      setTimeout(() => { location.href = '/'; }, 900);
    });
  </script>
</body>
</html>
