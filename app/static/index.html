<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WildEx — Capture</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080f14;
      --surface:  #0e1a24;
      --surface2: #152130;
      --accent:   #22c55e;
      --accent2:  #16a34a;
      --warn:     #f59e0b;
      --danger:   #ef4444;
      --text:     #e8f0e9;
      --muted:    #5a7a62;
      --radius:   16px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden; }

    /* ── Screens ─────────────────────────────────────────────── */
    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .screen.active { opacity: 1; pointer-events: all; }

    /* ── Back button (top-left, all screens) ─────────────────── */
    .back-btn {
      position: absolute; top: 14px; left: 14px; z-index: 30;
      color: var(--accent); font-size: 0.9rem; font-weight: 600;
      text-decoration: none; padding: 8px 10px;
      background: rgba(8,15,20,0.6); border-radius: 10px;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Capture screen ──────────────────────────────────────── */
    #preview-bg {
      position: absolute; inset: 0; background: var(--surface); overflow: hidden;
    }
    #preview-img {
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0; transition: opacity 0.3s ease;
    }
    #preview-img.visible { opacity: 1; }
    #preview-video {
      width: 100%; height: 100%; object-fit: cover;
      display: none;
    }
    #preview-video.visible { display: block; }

    .placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: var(--muted);
    }
    .placeholder svg { opacity: 0.35; }
    .placeholder p { font-size: 0.9rem; text-align: center; padding: 0 32px; line-height: 1.5; }

    .capture-bar {
      position: relative; z-index: 10; width: 100%;
      padding: 20px 24px 44px;
      background: linear-gradient(to top, rgba(8,15,20,0.96) 65%, transparent);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      margin-top: auto;
    }

    /* ── Mode toggle (Photo / Video) ──────────────────────────── */
    .mode-toggle {
      display: flex; background: var(--surface2); border-radius: 10px;
      padding: 3px; gap: 2px;
    }
    .mode-btn {
      padding: 7px 18px; border: none; border-radius: 8px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      background: transparent; color: var(--muted);
      transition: background 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .mode-btn.active { background: var(--surface); color: var(--text); }

    #wordmark { font-size: 1rem; font-weight: 700; letter-spacing: 0.14em;
      color: var(--accent); text-transform: uppercase; }
    #gps-status { font-size: 0.75rem; color: var(--muted); display: flex;
      align-items: center; gap: 6px; }
    #gps-dot { width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0; transition: background 0.4s; }
    #gps-dot.acquired { background: var(--accent); }
    #sync-status {
      display: none;
      width: 100%;
      max-width: 340px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(21,33,48,0.92);
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
    }
    #sync-status.visible { display: block; }

    .btn {
      width: 100%; max-width: 340px; padding: 15px; border: none;
      border-radius: var(--radius); font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: transform 0.1s, opacity 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); opacity: 0.88; }
    .btn-primary   { background: var(--accent); color: #000; }
    .btn-secondary { background: var(--surface2); color: var(--text);
      border: 1px solid rgba(255,255,255,0.07); }

    #capture-btn { display: none; }
    #capture-btn.visible { display: block; }

    /* ── Loading screen ──────────────────────────────────────── */
    #loading-screen { background: var(--bg); justify-content: center; gap: 32px; }
    .spinner { width: 52px; height: 52px; border: 3px solid var(--surface2);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .steps { display: flex; flex-direction: column; gap: 10px; }
    .step { display: flex; align-items: center; gap: 10px;
      font-size: 0.85rem; color: var(--muted); transition: color 0.35s; }
    .step.active { color: var(--text); }
    .step.done   { color: var(--accent); }
    .step-dot { width: 6px; height: 6px; border-radius: 50%;
      background: currentColor; flex-shrink: 0; }

    /* ── Result screen ───────────────────────────────────────── */
    #result-screen { background: var(--bg); justify-content: flex-start;
      overflow-y: auto; -webkit-overflow-scrolling: touch; }

    #result-photo { display: none; }

    .result-body { width: 100%; padding: 20px 18px 52px;
      display: flex; flex-direction: column; gap: 18px; }
    .card-display {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .flip-card {
      perspective: 1400px;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      min-height: 620px;
      transform-style: preserve-3d;
      transition: transform 0.7s ease;
    }
    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 22px 60px rgba(0,0,0,0.42);
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(8,15,20,0.95), rgba(8,15,20,1));
    }
    .card-face.back {
      transform: rotateY(180deg);
    }
    .card-front-photo {
      position: relative;
      min-height: 290px;
      overflow: hidden;
      background: rgba(255,255,255,0.04);
    }
    .card-front-photo.landscape {
      min-height: 220px;
    }
    .card-front-photo img {
      width: 100%;
      height: 100%;
      min-height: 290px;
      object-fit: cover;
      display: block;
    }
    .card-front-photo.landscape img {
      min-height: 220px;
    }
    .card-front-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.08), transparent 34%, rgba(0,0,0,0.72)),
        radial-gradient(circle at top right, rgba(255,255,255,0.16), transparent 30%);
      pointer-events: none;
    }
    .card-ribbon {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(8,15,20,0.72);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .card-ribbon-icon {
      font-size: 0.95rem;
    }
    .card-front-title {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
    }
    .card-front-title .name-block {
      min-width: 0;
    }
    .card-front-title .common-name {
      font-size: 1.9rem;
      text-shadow: 0 4px 18px rgba(0,0,0,0.48);
    }
    .card-front-title .sci-name {
      color: rgba(232,240,233,0.76);
    }
    .score-chip {
      min-width: 82px;
      padding: 10px 12px;
      border-radius: 18px;
      background: rgba(8,15,20,0.78);
      border: 1px solid rgba(255,255,255,0.12);
      text-align: center;
      flex-shrink: 0;
    }
    .score-chip strong {
      display: block;
      font-size: 1.05rem;
    }
    .score-chip span {
      display: block;
      margin-top: 3px;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(232,240,233,0.68);
    }
    .card-face-body {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      flex: 1;
    }
    .card-face-body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.06), transparent 36%),
        linear-gradient(180deg, transparent, rgba(255,255,255,0.03));
      pointer-events: none;
    }
    .card-face-body > * {
      position: relative;
      z-index: 1;
    }
    .card-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .card-title-kicker {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(232,240,233,0.74);
    }
    .card-rank-pill {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .card-back-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }
    .card-back-icon {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .card-back-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .meta-chip {
      padding: 12px;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .meta-chip .label {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(232,240,233,0.62);
    }
    .meta-chip .value {
      margin-top: 6px;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .flip-actions {
      display: flex;
      gap: 10px;
    }
    .flip-actions .btn {
      max-width: none;
    }
    .theme-reptile {
      background:
        linear-gradient(160deg, rgba(104,36,18,0.98), rgba(43,17,11,0.98)),
        radial-gradient(circle at top left, rgba(255,180,98,0.18), transparent 32%);
    }
    .theme-reptile .card-face-body {
      background:
        linear-gradient(180deg, rgba(40,17,8,0.58), rgba(16,10,8,0.9)),
        repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 8px, transparent 8px 16px);
    }
    .theme-mammal {
      background:
        linear-gradient(160deg, rgba(51,63,35,0.98), rgba(21,27,19,0.98)),
        radial-gradient(circle at top right, rgba(181,142,96,0.18), transparent 30%);
    }
    .theme-bird {
      background:
        linear-gradient(160deg, rgba(24,62,92,0.98), rgba(15,28,44,0.98)),
        radial-gradient(circle at top center, rgba(167,220,255,0.22), transparent 34%);
    }
    .theme-fish {
      background:
        linear-gradient(160deg, rgba(7,74,99,0.98), rgba(5,28,44,0.98)),
        radial-gradient(circle at top right, rgba(102,233,255,0.2), transparent 34%);
    }
    .theme-plant {
      background:
        linear-gradient(160deg, rgba(97,83,47,0.98), rgba(51,44,24,0.98)),
        radial-gradient(circle at top left, rgba(240,226,173,0.18), transparent 34%);
    }
    .theme-fungi {
      background:
        linear-gradient(160deg, rgba(76,40,54,0.98), rgba(32,18,28,0.98)),
        radial-gradient(circle at top left, rgba(255,190,214,0.16), transparent 34%);
    }
    .theme-terrain {
      background:
        linear-gradient(160deg, rgba(65,60,52,0.98), rgba(26,24,23,0.98)),
        radial-gradient(circle at top left, rgba(233,204,164,0.14), transparent 30%);
    }
    .theme-pending {
      background:
        linear-gradient(160deg, rgba(35,35,49,0.98), rgba(14,14,24,0.98)),
        radial-gradient(circle at top right, rgba(135,146,255,0.18), transparent 34%);
    }
    @media (max-width: 420px) {
      .flip-card-inner { min-height: 580px; }
      .card-back-grid { grid-template-columns: 1fr; }
      .card-front-title .common-name { font-size: 1.65rem; }
    }
    @media print {
      body { background: #fff; }
      .back-btn, .btn, .save-banner { display: none !important; }
      .screen { position: static; opacity: 1 !important; pointer-events: all !important; }
      #capture-screen, #loading-screen { display: none !important; }
      #result-screen { overflow: visible; }
      .result-body { padding: 0; }
      .flip-card { perspective: none; }
      .flip-card-inner { transform: none !important; min-height: auto; display: grid; gap: 16px; }
      .card-face { position: relative; transform: none !important; page-break-inside: avoid; }
      .flip-actions { display: none !important; }
    }

    .save-banner {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-radius: 12px; font-size: 0.88rem; font-weight: 600;
    }
    .save-banner.saved { background: rgba(34,197,94,0.12); color: var(--accent);
      border: 1px solid rgba(34,197,94,0.25); }
    .save-banner.unsaved { background: rgba(245,158,11,0.1); color: var(--warn);
      border: 1px solid rgba(245,158,11,0.2); }

    .name-block { display: flex; flex-direction: column; gap: 3px; }
    .common-name { font-size: 1.7rem; font-weight: 700; line-height: 1.15; }
    .sci-name { font-size: 0.9rem; font-style: italic; color: var(--muted); }

    .badges { display: flex; flex-wrap: wrap; gap: 7px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.74rem;
      font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .badge-green  { background: rgba(34,197,94,0.14);  color: var(--accent); }
    .badge-amber  { background: rgba(245,158,11,0.14); color: var(--warn); }
    .badge-red    { background: rgba(239,68,68,0.14);  color: var(--danger); }
    .badge-muted  { background: var(--surface2); color: var(--muted); }

    .conf-row { display: flex; flex-direction: column; gap: 7px; }
    .conf-label { display: flex; justify-content: space-between; font-size: 0.8rem; }
    .conf-label span:first-child { color: var(--muted); }
    .conf-label span:last-child  { font-weight: 700; }
    .conf-track { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .conf-fill  { height: 100%; border-radius: 3px;
      transition: width 0.7s cubic-bezier(0.34,1.56,0.64,1); }

    .stats-card { background: var(--surface); border-radius: var(--radius);
      padding: 16px; display: flex; flex-direction: column; gap: 11px; }
    .stats-title { font-size: 0.72rem; font-weight: 700; color: var(--muted);
      letter-spacing: 0.1em; text-transform: uppercase; }
    .stat-row { display: flex; align-items: center; gap: 10px; }
    .stat-label { font-size: 0.72rem; font-weight: 700; color: var(--muted);
      letter-spacing: 0.06em; width: 32px; flex-shrink: 0; }
    .stat-track { flex: 1; height: 6px; background: var(--surface2);
      border-radius: 3px; overflow: hidden; }
    .stat-fill  { height: 100%; border-radius: 3px;
      transition: width 0.65s cubic-bezier(0.34,1.56,0.64,1); }
    .stat-val   { font-size: 0.8rem; font-weight: 700; width: 26px;
      text-align: right; flex-shrink: 0; }

    .blurb { font-size: 0.9rem; line-height: 1.6; color: var(--muted);
      padding: 14px 16px; background: var(--surface); border-radius: var(--radius);
      border-left: 2px solid var(--accent2); }

    .detail-card { background: var(--surface); border-radius: var(--radius);
      padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .detail-row { display: flex; justify-content: space-between;
      align-items: flex-start; gap: 10px; font-size: 0.84rem; }
    .detail-key { color: var(--muted); flex-shrink: 0; }
    .detail-val { color: var(--text); font-weight: 500; text-align: right; }

    .error-box { background: rgba(239,68,68,0.07);
      border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius);
      padding: 20px; text-align: center; color: var(--danger);
      font-size: 0.88rem; line-height: 1.5; }
  </style>
</head>
<body>

  <!-- ── Capture screen ────────────────────────────────────────── -->
  <div class="screen active" id="capture-screen">
    <a class="back-btn" href="/">&#8592; Back</a>

    <div id="preview-bg">
      <img id="preview-img" alt="">
      <video id="preview-video" playsinline muted loop></video>
      <div class="placeholder" id="placeholder">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.4">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <p>Point at any animal, plant, fungi, or terrain</p>
      </div>
    </div>

    <div class="capture-bar">
      <div id="wordmark">WildEx</div>

      <div class="mode-toggle">
        <button class="mode-btn active" id="mode-photo" onclick="setMode('photo')">📷 Photo</button>
        <button class="mode-btn" id="mode-video" onclick="setMode('video')">🎬 Video</button>
      </div>

      <div id="gps-status">
        <div id="gps-dot"></div>
        <span id="gps-text">Acquiring GPS...</span>
      </div>
      <div id="sync-status"></div>

      <label class="btn btn-primary" id="open-label" for="camera-input">Take Photo</label>
      <input type="file" id="camera-input" accept="image/*" capture="environment"
             style="display:none">

      <button class="btn btn-secondary" id="capture-btn">Identify &amp; Save to WildDex</button>
    </div>
  </div>

  <!-- ── Loading screen ──────────────────────────────────────── -->
  <div class="screen" id="loading-screen">
    <div class="spinner"></div>
    <div class="steps">
      <div class="step" id="s0"><div class="step-dot"></div>Extracting best frame</div>
      <div class="step active" id="s1"><div class="step-dot"></div>Identifying subject</div>
      <div class="step"        id="s2"><div class="step-dot"></div>Looking up species data</div>
      <div class="step"        id="s3"><div class="step-dot"></div>Getting rarity &amp; range</div>
      <div class="step"        id="s4"><div class="step-dot"></div>Writing card</div>
      <div class="step"        id="s5"><div class="step-dot"></div>Saving to WildDex</div>
    </div>
  </div>

  <!-- ── Result screen ─────────────────────────────────────────── -->
  <div class="screen" id="result-screen">
    <a class="back-btn" href="/">&#8592; Back</a>
    <img id="result-photo" alt="">
    <div class="result-body" id="result-body"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const screens = ['capture-screen','loading-screen','result-screen'].map($);
    const QUEUE_DB_NAME = 'wildex-offline';
    const QUEUE_STORE = 'capture_queue';
    let syncInFlight = false;

    fetch('/auth/me', { credentials: 'same-origin' }).then(resp => {
      if (resp.status === 401) location.href = '/login';
    }).catch(() => {});

    function openQueueDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(QUEUE_DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(QUEUE_STORE)) {
            db.createObjectStore(QUEUE_STORE, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('IndexedDB unavailable'));
      });
    }

    async function queueTx(mode, handler) {
      const db = await openQueueDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(QUEUE_STORE, mode);
        const store = tx.objectStore(QUEUE_STORE);
        let result;
        try {
          result = handler(store, tx);
        } catch (err) {
          db.close();
          reject(err);
          return;
        }
        tx.oncomplete = () => {
          db.close();
          resolve(result);
        };
        tx.onerror = () => {
          db.close();
          reject(tx.error || new Error('Queue transaction failed'));
        };
      });
    }

    async function enqueueCapture(file, coords) {
      await queueTx('readwrite', store => {
        store.add({
          created_at: Date.now(),
          file,
          lat: coords?.lat ?? null,
          lon: coords?.lon ?? null,
        });
      });
      await refreshQueueStatus();
    }

    async function listQueuedCaptures() {
      const db = await openQueueDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(QUEUE_STORE, 'readonly');
        const req = tx.objectStore(QUEUE_STORE).getAll();
        req.onsuccess = () => {
          db.close();
          resolve((req.result || []).sort((a, b) => a.id - b.id));
        };
        req.onerror = () => {
          db.close();
          reject(req.error || new Error('Could not read queue'));
        };
      });
    }

    async function deleteQueuedCapture(id) {
      await queueTx('readwrite', store => store.delete(id));
    }

    async function queuedCount() {
      const db = await openQueueDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(QUEUE_STORE, 'readonly');
        const req = tx.objectStore(QUEUE_STORE).count();
        req.onsuccess = () => {
          db.close();
          resolve(req.result || 0);
        };
        req.onerror = () => {
          db.close();
          reject(req.error || new Error('Could not count queue'));
        };
      });
    }

    async function refreshQueueStatus(message = '') {
      try {
        const count = await queuedCount();
        if (!count && !message) {
          $('sync-status').classList.remove('visible');
          $('sync-status').textContent = '';
          return;
        }
        const parts = [];
        if (message) parts.push(message);
        if (count) parts.push(`${count} capture${count === 1 ? '' : 's'} queued for upload`);
        $('sync-status').textContent = parts.join(' • ');
        $('sync-status').classList.add('visible');
      } catch (_) {
        $('sync-status').classList.remove('visible');
      }
    }

    async function uploadQueuedCapture(entry) {
      const file = entry.file instanceof File
        ? entry.file
        : new File([entry.file], entry.file?.name || 'offline-capture.jpg', { type: entry.file?.type || 'application/octet-stream' });
      const form = new FormData();
      form.append('file', file, file.name || 'offline-capture');
      if (entry.lat != null && entry.lon != null) {
        form.append('lat', entry.lat);
        form.append('lon', entry.lon);
      }
      const resp = await fetch('/capture', {
        method: 'POST',
        body: form,
        credentials: 'same-origin',
      });
      if (resp.status === 401) {
        location.href = '/login';
        throw new Error('Authentication required');
      }
      if (!resp.ok) {
        throw new Error(`Queued upload failed (${resp.status})`);
      }
      return resp.json();
    }

    async function processQueuedCaptures() {
      if (syncInFlight || !navigator.onLine) {
        await refreshQueueStatus(navigator.onLine ? '' : 'Offline mode active');
        return;
      }
      syncInFlight = true;
      try {
        const queue = await listQueuedCaptures();
        if (!queue.length) {
          await refreshQueueStatus('');
          return;
        }
        await refreshQueueStatus('Connection restored • syncing queued captures');
        for (const entry of queue) {
          await uploadQueuedCapture(entry);
          await deleteQueuedCapture(entry.id);
          await refreshQueueStatus('Queued capture uploaded');
        }
      } catch (err) {
        await refreshQueueStatus(navigator.onLine ? 'Sync paused until upload succeeds' : 'Offline mode active');
      } finally {
        syncInFlight = false;
      }
    }

          $('gps-text').textContent =

    function normalizeKingdom(c) {
      const category = (c.category || '').toLowerCase();
      const sub = (c.sub_category || '').toLowerCase();
      const iconic = (c.iconic_taxon || '').toLowerCase();
      if ((c.species_name || '').toLowerCase() === 'pending identification') return 'pending';
      if (category === 'plant' || iconic === 'plantae') return 'plant';
      if (category === 'fungi' || iconic === 'fungi') return 'fungi';
      if (category === 'terrain' || iconic === 'terrain') return 'terrain';
      if (sub === 'reptile' || iconic === 'reptilia') return 'reptile';
      if (sub === 'bird' || iconic === 'aves') return 'bird';
      if (sub === 'fish' || sub === 'marine' || iconic === 'actinopterygii') return 'fish';
      if (category === 'animal' || iconic === 'mammalia') return 'mammal';
      return 'mammal';
    }

    function biomeTheme(c, kingdom) {
      const location = c.capture_country || (c.latitude != null && c.longitude != null ? `${c.latitude.toFixed(2)}, ${c.longitude.toFixed(2)}` : 'Unknown range');
      const map = {
        reptile: { label: 'Rocky Escarpment', icon: '🐉', frame: 'theme-reptile', habitat: 'Arid / rocky biome', location },
        mammal: { label: 'Woodland Run', icon: '🐾', frame: 'theme-mammal', habitat: 'Earth / grassland biome', location },
        bird: { label: 'Canopy Draft', icon: '🪶', frame: 'theme-bird', habitat: 'Sky / cliff biome', location },
        fish: { label: 'Estuary Current', icon: '🌊', frame: 'theme-fish', habitat: 'Ocean / reef biome', location },
        plant: { label: 'Herbarium Plate', icon: '🌿', frame: 'theme-plant', habitat: 'Botanical archive', location },
        fungi: { label: 'Forest Floor', icon: '🍄', frame: 'theme-fungi', habitat: 'Shade / decay biome', location },
        terrain: { label: 'Geostrata', icon: '🪨', frame: 'theme-terrain', habitat: 'Landform record', location },
        pending: { label: 'Field Archive', icon: '⏳', frame: 'theme-pending', habitat: 'Awaiting classification', location },
      };
      return map[kingdom] || map.mammal;
    }

      const STAT_COLORS = { speed:'#38bdf8', attack:'#f87171', defence:'#a78bfa', hp:'#34d399', stamina_regen:'#fb923c' };
      const STAT_LABELS = { speed:'SPD', attack:'ATK', defence:'DEF', hp:'HP', stamina_regen:'STM' };
      return Object.entries(stats).map(([k, v]) => `
        <div class="stat-row">
          <span class="stat-label">${STAT_LABELS[k]}</span>
          <div class="stat-track">
            <div class="stat-fill" data-val="${v}" style="width:0;background:${STAT_COLORS[k]}"></div>

    function applyOrientationClass(container, width, height) {
      if (!container || !width || !height) return;
      container.classList.remove('landscape', 'portrait', 'square');
      const ratio = width / height;
      if (ratio > 1.18) container.classList.add('landscape');
      else if (ratio < 0.85) container.classList.add('portrait');
      else container.classList.add('square');
    }

    function bindCardImageOrientation(imgId, containerSelector, fallbackPhoto) {
      const img = $(imgId);
      if (!img) return;
      const container = img.closest(containerSelector);
      const apply = () => applyOrientationClass(container, img.naturalWidth, img.naturalHeight);
      img.onload = apply;
      img.onerror = () => {
        img.onerror = null;
        if (fallbackPhoto && img.src !== fallbackPhoto) {
          img.src = fallbackPhoto;
          return;
        }
        applyOrientationClass(container, 1, 1);
      };
      if (img.complete) apply();
    }

    $('capture-btn').addEventListener('click', async () => {
      if (!capturedFile) return;

      const isVideo = capturedFile.type.startsWith('video/');
      const queuedCoords = gpsCoords ? { ...gpsCoords } : null;

      // Reset steps
      ['s0','s1','s2','s3','s4','s5'].forEach(id => $(id).className = 'step');
      if (isVideo) {
        $('s0').className = 'step active';
        $('s0').style.display = '';
      } else {
        $('s0').style.display = 'none';
        $('s1').className = 'step active';
      }
      show('loading-screen');

      // Step timer offsets differ for video (extra frame extraction step)
      const base = isVideo ? 3000 : 0;
      const timings = [
        [base + 0,    's0', 's1'],
        [base + 4000, 's1', 's2'],
        [base + 7000, 's2', 's3'],
        [base + 10000,'s3', 's4'],
        [base + 14000,'s4', 's5'],
      ];
      const timers = timings.map(([ms, done, next]) =>
        setTimeout(() => {
          if ($(done)) $(done).className = 'step done';
          if (next && $(next)) $(next).className = 'step active';
        }, ms)
      );

      const form = new FormData();
      form.append('file', capturedFile);
      if (queuedCoords) {
        form.append('lat', queuedCoords.lat);
        form.append('lon', queuedCoords.lon);
      }

      if (!navigator.onLine) {
        timers.forEach(clearTimeout);
        await enqueueCapture(capturedFile, queuedCoords);
        renderQueuedCapture(capturedFile, queuedCoords);
        return;
      }

      try {
        const resp = await fetch('/capture', { method: 'POST', body: form, credentials: 'same-origin' });
        timers.forEach(clearTimeout);

        if (resp.status === 401) {
          location.href = '/login';
          return;
        }

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: `Server error ${resp.status}` }));
          showError(err.detail || `Capture failed (${resp.status})`);
          return;
        }

        const data = await resp.json();
        ['s0','s1','s2','s3','s4','s5'].forEach(id => { if ($(id)) $(id).className = 'step done'; });
        await new Promise(r => setTimeout(r, 400));
        renderStyledCard(data);

      } catch (e) {
        timers.forEach(clearTimeout);
        try {
          await enqueueCapture(capturedFile, queuedCoords);
          renderQueuedCapture(capturedFile, queuedCoords);
        } catch (_) {
          showError('Could not reach server. Check your connection.');
        }
      }
    });

      return `<div class="detail-row">
        <span class="detail-key">${esc(String(k))}</span>
        <span class="detail-val">${esc(String(v))}</span>
      </div>`;
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    window.addEventListener('online', () => processQueuedCaptures());
    window.addEventListener('focus', () => processQueuedCaptures());
    window.setInterval(() => { processQueuedCaptures().catch(() => {}); }, 15000);
    refreshQueueStatus(navigator.onLine ? '' : 'Offline mode active').catch(() => {});
    processQueuedCaptures().catch(() => {});
  </script>
</body>
</html>
